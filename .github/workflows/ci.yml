name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval --mock --json > /tmp/eval.json
      - run: node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/eval.json","utf-8"));const p=r.providers&&r.providers[0];if(!p||p.skipped||!p.metrics||p.metrics.total!==45||p.metrics.fail!==0||p.metrics.partial!==0){console.error("mock eval gate failed:",JSON.stringify(p&&p.metrics));process.exit(1);}' && echo "mock eval ok"
